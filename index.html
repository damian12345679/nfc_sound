<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10081b"><title>Tapni – zvuk</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:radial-gradient(circle at 50% 30%,#402060,#10081b 65%);color:#fff;font-family:system-ui,-apple-system,sans-serif;text-align:center}.wrap{padding:28px;width:min(100%,480px)}.orb{margin:0 auto 30px;width:150px;height:150px;border-radius:50%;background:linear-gradient(135deg,#a855f7,#6d28d9);display:grid;place-items:center;box-shadow:0 0 70px #9333ea77;font-size:68px}.orb.playing{animation:pulse .45s infinite alternate}@keyframes pulse{to{transform:scale(1.13);box-shadow:0 0 100px #a855f7}}h1{font-size:34px;margin:0 0 12px}p{color:#c4b5d8;line-height:1.5}button{margin-top:22px;border:0;border-radius:16px;background:#a855f7;color:white;font-weight:800;font-size:20px;padding:18px 35px;cursor:pointer;width:100%;max-width:300px}small{display:block;color:#b9a6cc;margin-top:20px}</style></head><body><main class="wrap"><div id="orb" class="orb">🔊</div><h1>POZOR NA UŠI!</h1><p>Tvůj NFC zvuk je připraven.</p><button id="play">▶ Přehrát zvuk</button><small id="status">Zkouším automatické přehrání…</small><audio id="audio" src="zvuk.mp3" preload="auto"></audio></main><script>const a=document.getElementById('audio'),b=document.getElementById('play'),o=document.getElementById('orb'),s=document.getElementById('status');async function play(){try{a.currentTime=0;await a.play();s.textContent='Přehrává se';}catch(e){s.textContent='Prohlížeč vyžaduje klepnutí na tlačítko.'}}b.addEventListener('click',play);a.addEventListener('play',()=>o.classList.add('playing'));a.addEventListener('ended',()=>{o.classList.remove('playing');s.textContent='Hotovo! Můžeš přehrát znovu.'});a.addEventListener('pause',()=>o.classList.remove('playing'));window.addEventListener('load',play);</script></body></html>
